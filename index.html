.choices{display:grid;gap:.6rem;margin:2rem 0 1rem}

button:hover{border-color:var(--brass)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button.snd{flex:none;padding:.25rem .7rem;font-size:.8125rem;border-radius:1rem;font-family:inherit;color:var(--soft)}
button.go{background:var(--ink);color:var(--bg);border-color:var(--ink);width:fit-content;padding:.8rem 1.6rem}
.end h2{font-weight:900;font-size:1.9rem;margin:3rem 0 .5rem;line-height:1.3}
.end .kind{color:var(--soft);font-size:.9375rem;margin:0}

.review h3{font-family:"Noto Serif SC",serif;font-size:1.2rem;margin:0 0 .3rem}
.review ul{list-style:none;padding:0;margin:1rem 0}
.review li{padding:.55rem 0 .55rem 1.9rem;border-bottom:1px solid var(--line);position:relative}

.help{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:1rem 1.1rem;margin:1.5rem 0}
.help b{color:var(--warn)}
</style>

  const ul=el("ul");
  Object.keys(FLAGS).forEach(k=>{const li=el("li",S.seen.has(k)?"hit":"",FLAGS[k][0]);li.append(el("small","",FLAGS[k][1]));ul.append(li)});
  r.append(ul);
  const h=el("div","help");
  h.innerHTML="不必说出全部秘密，也可以让一个人知道你的航班、住处和实时位置。<br><br>全国反诈专线 <b>96110</b><br>外交部全球领事保护热线 <b>+86-10-12308</b><br>泰国旅游警察 <b>1155</b>";
  r.append(h);sec.append(r);
  const b=el("button","go","再走一遍");b.onclick=title;box.append(b);
}
title();
</script>
